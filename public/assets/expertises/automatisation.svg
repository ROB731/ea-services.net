<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Illustration : une suite de relances automatiques, de la demande reçue jusqu&#x27;au rappel du commercial">
<defs>
  <radialGradient id="halo" cx="70%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#294365"/><stop offset="100%" stop-color="#091a32"/>
  </radialGradient>
  <pattern id="points" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".07"/>
  </pattern>
  <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".38"/>
  </filter>
  <filter id="ombre-douce" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
  </filter>
</defs>
<rect x="0" y="0" width="640" height="520" rx="0" fill="url(#halo)" />
<rect x="0" y="0" width="640" height="520" rx="0" fill="url(#points)" />
<circle cx="560" cy="70" r="150" fill="#f2b62b" opacity=".08"/>
<circle cx="560" cy="70" r="90" fill="none" stroke="#f2b62b" stroke-opacity=".25"/>
<path d="M118 120 v40" stroke="#f2b62b" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><g transform="translate(70,54)" filter="url(#ombre-douce)"><rect x="0" y="0" width="330" height="70" rx="14" fill="#fffdf8" /><circle cx="48" cy="35" r="14" fill="#128c4a"/><path d="M44 35 l3 3 l5 -6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#112849" text-anchor="start" opacity="1">Demande reçue</text><text x="76" y="50" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5a6577" text-anchor="start" opacity="1">Réponse envoyée aussitôt</text><text x="312" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7d5605" text-anchor="end" opacity="1">Lundi 9 h 02</text></g><path d="M118 226 v40" stroke="#f2b62b" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><g transform="translate(70,160)" filter="url(#ombre-douce)"><rect x="0" y="0" width="330" height="70" rx="14" fill="#fffdf8" /><circle cx="48" cy="35" r="14" fill="#128c4a"/><path d="M44 35 l3 3 l5 -6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#112849" text-anchor="start" opacity="1">Relance à 3 jours</text><text x="76" y="50" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5a6577" text-anchor="start" opacity="1">Message personnalisé</text><text x="312" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7d5605" text-anchor="end" opacity="1">Jeudi 9 h 00</text></g><path d="M118 332 v40" stroke="#f2b62b" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><g transform="translate(70,266)" filter="url(#ombre-douce)"><rect x="0" y="0" width="330" height="70" rx="14" fill="#fffdf8" /><circle cx="48" cy="35" r="14" fill="#128c4a"/><path d="M44 35 l3 3 l5 -6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#112849" text-anchor="start" opacity="1">Relance à 7 jours</text><text x="76" y="50" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5a6577" text-anchor="start" opacity="1">Dernier rappel</text><text x="312" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7d5605" text-anchor="end" opacity="1">Lundi 9 h 00</text></g><g transform="translate(70,372)" filter="url(#ombre-douce)"><rect x="0" y="0" width="330" height="70" rx="14" fill="#fffdf8" /><circle cx="48" cy="35" r="14" fill="#f2b62b"/><path d="M44 35 l3 3 l5 -6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#112849" text-anchor="start" opacity="1">À rappeler</text><text x="76" y="50" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5a6577" text-anchor="start" opacity="1">Le prospect a répondu</text><text x="312" y="30" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7d5605" text-anchor="end" opacity="1">Aujourd&#x27;hui</text></g><g transform="translate(430,150)" filter="url(#ombre)"><rect x="0" y="0" width="180" height="210" rx="18" fill="#112849" /><text x="90" y="44" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" text-anchor="middle" opacity="0.7">Ce mois-ci</text><text x="90" y="100" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="52" font-weight="800" fill="#f2b62b" text-anchor="middle" opacity="1">0</text><text x="90" y="126" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle" opacity="1">relance oubliée</text><rect x="28" y="150" width="124" height="1" rx="0.5" fill="#ffffff" opacity=".2" /><text x="90" y="178" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.8">Tout part au bon</text><text x="90" y="194" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.8">moment, sans vous</text></g>
</svg>
