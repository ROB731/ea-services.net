<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Illustration : une formation à l&#x27;intelligence artificielle sur ordinateur, appliquée à un vrai document de travail">
<defs>
  <radialGradient id="halo" cx="70%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#294365"/><stop offset="100%" stop-color="#091a32"/>
  </radialGradient>
  <pattern id="points" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".07"/>
  </pattern>
  <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".38"/>
  </filter>
  <filter id="ombre-douce" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
  </filter>
</defs>
<rect x="0" y="0" width="640" height="520" rx="0" fill="url(#halo)" />
<rect x="0" y="0" width="640" height="520" rx="0" fill="url(#points)" />
<circle cx="560" cy="70" r="150" fill="#f2b62b" opacity=".08"/>
<circle cx="560" cy="70" r="90" fill="none" stroke="#f2b62b" stroke-opacity=".25"/>
<g transform="translate(60,56)" filter="url(#ombre)"><rect x="0" y="0" width="520" height="320" rx="16" fill="#05101f" /><rect x="10" y="10" width="500" height="300" rx="8" fill="#fffdf8" /><rect x="10" y="10" width="500" height="38" rx="8" fill="#f7f4ec" /><rect x="10" y="40" width="500" height="8" rx="0" fill="#f7f4ec" /><text x="26" y="34" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#112849" text-anchor="start" opacity="1">Module 3 · Résumer et vérifier</text><rect x="380" y="22" width="110" height="14" rx="7" fill="#ebe5d8" /><rect x="380" y="22" width="74" height="14" rx="7" fill="#f2b62b" /><rect x="26" y="64" width="220" height="230" rx="10" fill="#fff" stroke="#d6dbe4"/><text x="40" y="88" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#5a6577" text-anchor="start" opacity="1">Votre document</text><rect x="40" y="102" width="190" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="120" width="162" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="138" width="134" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="156" width="190" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="174" width="162" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="192" width="134" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="210" width="190" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="228" width="162" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="246" width="134" height="7" rx="3.5" fill="#e9edf3" /><rect x="40" y="262" width="120" height="16" rx="8" fill="#f2b62b" opacity=".25"/><rect x="262" y="64" width="232" height="230" rx="10" fill="#112849" /><rect x="276" y="80" width="170" height="46" rx="10" fill="#ffffff" opacity=".12"/><text x="288" y="99" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="500" fill="#fff" text-anchor="start" opacity="1">Résume ce rapport en</text><text x="288" y="115" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="500" fill="#fff" text-anchor="start" opacity="1">trois points clés.</text><rect x="300" y="138" width="180" height="92" rx="10" fill="#fffdf8" /><text x="312" y="160" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="600" fill="#112849" text-anchor="start" opacity="1">1. Ventes en hausse</text><text x="312" y="182" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="600" fill="#112849" text-anchor="start" opacity="1">2. Stock à revoir</text><text x="312" y="204" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="600" fill="#112849" text-anchor="start" opacity="1">3. Deux relances dues</text><rect x="276" y="244" width="204" height="36" rx="10" fill="#f2b62b" opacity=".2"/><text x="288" y="260" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#f2b62b" text-anchor="start" opacity="1">Toujours vérifier les</text><text x="288" y="274" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#f2b62b" text-anchor="start" opacity="1">chiffres dans la source.</text></g><rect x="30" y="376" width="580" height="14" rx="7" fill="#1b2c47" /><g transform="translate(60,420)" filter="url(#ombre-douce)"><rect x="0" y="0" width="240" height="56" rx="14" fill="#fffdf8" /><circle cx="26" cy="28" r="9" fill="#128c4a"/><path d="M22 28 l3 3 l5 -6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="24" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#112849" text-anchor="start" opacity="1">Exercices sur vos</text><text x="44" y="41" font-family="DM Sans, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5a6577" text-anchor="start" opacity="1">propres documents</text></g>
</svg>
