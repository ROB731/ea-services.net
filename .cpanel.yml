---
# Déploiement cPanel (LWS). La racine du domaine reste public_html (non
# modifiable) ; le code vit hors du web :
#   /home/c2799087c/ea-services/   src/ config/ views/ data/ storage/
#   /home/c2799087c/public_html/   uniquement le contenu de public/
# ea-services/public est un lien vers public_html, pour que le code retrouve
# css, js et uploads au même endroit qu'en local.
# Ne touche jamais à data/, storage/, uploads/ ni config/secrets.php
# (données vivantes, jamais versionnées). Pas de rsync : cp seul.
# Limite : un fichier supprimé du dépôt reste sur le serveur.
deployment:
  tasks:
    - export APP=/home/c2799087c/ea-services
    - export WEB=/home/c2799087c/public_html
    - /bin/mkdir -p $APP/config $APP/src $APP/views $APP/data $APP/storage $WEB/uploads
    - /bin/cp -R config/. $APP/config/
    - /bin/cp -R src/. $APP/src/
    - /bin/cp -R views/. $APP/views/
    - /bin/cp -R public/. $WEB/
    - '[ -e $APP/public ] || /bin/ln -s $WEB $APP/public'
    - echo $APP > $WEB/.racine
    - /bin/chmod -R u+rwX,g+rwX $APP/data $APP/storage $WEB/uploads
