---
# Déploiement cPanel (LWS) : un simple push suffit, aucune manipulation dans
# cPanel. Le code va dans public_html ; le .htaccess racine n'expose que
# public/ et bloque src/, config/, views/, data/, storage/.
# Ne touche jamais à data/, storage/, public/uploads/ ni config/secrets.php
# (données vivantes, jamais versionnées). Pas de rsync : cp seul.
# Limite : un fichier supprimé du dépôt reste sur le serveur.
deployment:
  tasks:
    - export DEPLOYPATH=/home/c2799087c/public_html
    - /bin/mkdir -p $DEPLOYPATH/data $DEPLOYPATH/storage $DEPLOYPATH/public/uploads
    - /bin/cp -R public config src views $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess
    - /bin/chmod -R u+rwX,g+rwX $DEPLOYPATH/data $DEPLOYPATH/storage $DEPLOYPATH/public/uploads
    - printf 'Require all denied\n' > $DEPLOYPATH/data/.htaccess
    - printf 'Require all denied\n' > $DEPLOYPATH/storage/.htaccess
